<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>막차 귀갓길 시나리오 게임</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a facilitator's game table. Top bar with mode tabs, a step rail, and one "table" area where cards are laid out. */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --ink:#1d2330; --sub:#5b6170; --line:#d9d4c8; --faint:#ece8de;
  --accent:#d9541e; --accent-ink:#fff; --accent-soft:#fbe6dc;
  --time:#2f6fd6; --time-s:#e3ecfb; --cost:#b98300; --cost-s:#f8efd6; --safe:#c72d5e; --safe-s:#f9e1e9; --ease:#2c8a49; --ease-s:#e0f1e5;
  --night:#3b5cb8; --night-s:#e2e8f8; --future:#d9541e; --future-s:#fbe6dc; --opt:#6b45c9; --opt-s:#ece5fa; --event:#c2364a; --event-s:#f8e0e3; --cons:#5c6370; --cons-s:#e8e9ec; --blank:#c9a100; --blank-s:#fbf3cf;
  --ok:#2c8a49; --mid:#c99500; --no:#c7372f;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1e2128; --ink:#eceae4; --sub:#a3a7b2; --line:#343844; --faint:#262a33;
  --accent:#ff7a45; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --time:#7aa7ff; --time-s:#1d2a44; --cost:#e8b84a; --cost-s:#352c14; --safe:#ff7aa2; --safe-s:#3a1b27; --ease:#6fd08f; --ease-s:#173022;
  --night:#8ea6ff; --night-s:#1f2742; --future:#ff7a45; --future-s:#3a2418; --opt:#b39cff; --opt-s:#2a2142; --event:#ff8090; --event-s:#3a1c22; --cons:#b3b8c4; --cons-s:#2a2d35; --blank:#f0cd4a; --blank-s:#352e12;
  --ok:#6fd08f; --mid:#f0cd4a; --no:#ff7f76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1e2128; --ink:#eceae4; --sub:#a3a7b2; --line:#343844; --faint:#262a33;
  --accent:#ff7a45; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --time:#7aa7ff; --time-s:#1d2a44; --cost:#e8b84a; --cost-s:#352c14; --safe:#ff7aa2; --safe-s:#3a1b27; --ease:#6fd08f; --ease-s:#173022;
  --night:#8ea6ff; --night-s:#1f2742; --future:#ff7a45; --future-s:#3a2418; --opt:#b39cff; --opt-s:#2a2142; --event:#ff8090; --event-s:#3a1c22; --cons:#b3b8c4; --cons-s:#2a2d35; --blank:#f0cd4a; --blank-s:#352e12;
  --ok:#6fd08f; --mid:#f0cd4a; --no:#ff7f76; color-scheme:dark}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
.datapanel{margin-top:26px}.datapanel .row{gap:8px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}.brand small{display:block;font-weight:500;font-size:12px;color:var(--sub);letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{color:var(--sub);text-decoration:none;font-weight:600;padding:7px 14px;border-radius:999px;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-block:22px 60px}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 6px;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.lede{color:var(--sub);margin:0 0 18px;max-width:68ch}
.muted{color:var(--sub)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--sub)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:58px;resize:vertical}
/* cards */
.card{--c:var(--ink);--cs:var(--faint);background:var(--cs);border:2px solid var(--c);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:3px 3px 0 var(--c)}
.card .code{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--c);letter-spacing:.04em}
.card .tx{font-weight:700;font-size:16.5px;line-height:1.45}
.card .meta{font-size:12.5px;color:var(--sub)}
.k-night{--c:var(--night);--cs:var(--night-s)}.k-journey{--c:var(--ink);--cs:var(--surface)}.k-future{--c:var(--future);--cs:var(--future-s)}.k-opt{--c:var(--opt);--cs:var(--opt-s)}.k-event{--c:var(--event);--cs:var(--event-s)}.k-cons{--c:var(--cons);--cs:var(--cons-s)}.k-blank{--c:var(--blank);--cs:var(--blank-s)}
.k-time{--c:var(--time);--cs:var(--time-s)}.k-cost{--c:var(--cost);--cs:var(--cost-s)}.k-safe{--c:var(--safe);--cs:var(--safe-s)}.k-ease{--c:var(--ease);--cs:var(--ease-s)}
.pick{cursor:pointer;transition:transform .12s}
.pick[aria-pressed="true"]{outline:4px solid var(--c);outline-offset:2px;transform:translateY(-2px)}
.pick:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.pick,.pick:hover{transition:none;transform:none}}
button.card{font:inherit;color:inherit;text-align:left}
.chip{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react .chip[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.react .chip[data-v="mid"][aria-pressed="true"]{background:var(--mid);border-color:var(--mid);color:#1d1600}
.react .chip[data-v="no"][aria-pressed="true"]{background:var(--no);border-color:var(--no);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.ask{font-size:15px;background:var(--faint);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px}
.ask b{color:var(--accent)}
/* play layout */
.play{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
@media (max-width:820px){.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.rail button{font:inherit;text-align:left;border:0;background:transparent;color:var(--sub);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.rail button .n{font-family:var(--f-mono);font-size:12px}
.rail button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.rail button.done{color:var(--ink)}
.stage{display:grid;gap:16px;min-width:0}
.stephead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.time{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.status{font-size:13px;color:var(--sub)}
.situation{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:14px;align-items:start}
@media (max-width:720px){.situation{grid-template-columns:1fr}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .or{align-self:center;font-weight:700;color:var(--sub)}
@media (max-width:520px){.vs{grid-template-columns:1fr}.vs .or{justify-self:center}}
.board3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.board3{grid-template-columns:1fr}}
.bin{border:2px dashed var(--opt);border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:6px}
.bin h4{margin:0;font-size:14px;color:var(--opt)}
.optrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.optrow:last-child{border-bottom:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
/* lists */
.sessions{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.badge{font-family:var(--f-mono);font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;background:var(--ink);color:var(--bg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--sub);font-weight:600;background:var(--faint);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--faint);min-width:80px}
.bar i{display:block}
.quote{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.quote .who{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.verdict{border-radius:12px;padding:12px 14px;background:var(--faint);display:grid;gap:4px}
.verdict b{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.deckhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">막차 귀갓길 시나리오 게임<small>3팀 코크리에이션, 1:1 세션 진행 도구</small></div>
  <nav class="tabs" aria-label="화면">
    <a href="#play" data-tab="play">세션 진행</a>
    <a href="#results" data-tab="results">팀 결과</a>
    <a href="#cards" data-tab="cards">카드 전체</a>
  </nav>
</div></header>

<main class="wrap" id="app"></main>

<script>
/* ===================== CARD DATA (우리 팀 카드 세트) ===================== */
const NIGHT={T:[['T1','밤 11시'],['T2','자정'],['T3','새벽 1시 이후']],L:[['L1','회사 앞'],['L2','환승 정류장'],['L3','집 근처 정류장'],['L4','집 앞 골목']],R:[['R1','오늘은 혼자'],['R2','오늘은 동료와 같이'],['R3','오늘은 짐이 많은 날']]};
const JOURNEY=[['J1','① 퇴근 시간 정하기','막차 시간을 생각하며 나갈 때를 정한다'],['J2','② 무엇을 탈지 정하기','버스, 지하철, 택시 중 무엇을 탈지 고른다'],['J3','③ 정류장에서 기다리기','차가 오기를 기다린다'],['J4','④ 타고 가기','차 안에서 시간을 보낸다'],['J5','⑤ 내리기','내릴 곳에서 내린다'],['J6','⑥ 집까지 걷기','(빈칸) 참여자가 채운다']];

const N3=['N3','기사가 없다','차 안에는 승객만 있어요. 그래도 안심하고 타려면 무엇이 있어야 할까요?','무인, 기회 C, 가장 큰 Unknown'];
const OPTIONS=[['S1','인원 제한','한 차에 최대 4명까지만 타요.','ok'],['S2','짐칸','짐은 따로 두는 칸이 있어요.','ok'],['S3','칸막이 좌석','좌석이 칸막이로 나뉘어 있어요.','pink'],['S4','좌석 배정','옆자리는 배정된 대로 앉아요.','pink'],['S5','동승자 정보','함께 탄 사람이 어디서 내리는지 서로 화면에 보여요.','pink'],['S6','집 도착 확인','내린 뒤 "집에 도착했어요" 버튼을 누르게 돼요. 10분 안에 누르지 않으면 미리 정한 사람에게 알림이 가요.','unk']];
const CRIT={
 '시간-①':['time','빨리 집에 도착한다','전체 걸리는 시간'],'시간-②':['time','기다리지 않는다','정류장 대기'],'시간-③':['time','도착 시간이 정확하다','예측, 연착 없음'],
 '비용-①':['cost','큰돈이 나가지 않는다','한 번의 큰 지출'],'비용-②':['cost','낸 만큼 값어치가 있다','가성비'],'비용-③':['cost','손해 보지 않는다','환승 요금, 헛돈'],
 '안전-①':['safe','놓칠 걱정 없이 탈 수 있다','확실함'],'안전-②':['safe','모르는 사람과 단둘이 있지 않는다','사람'],'안전-③':['safe','무슨 일이 생기면 도와줄 사람이 있다','지켜봄'],
 '편안-①':['ease','가는 동안 잠들 수 있다','쉬기'],'편안-②':['ease','옆 사람 신경 쓰지 않고 간다','내 공간']};
const CATNAME={time:'시간',cost:'비용',safe:'안전',ease:'편안함'};
const CONS=[['K1','공휴일이라 막차가 평소보다 일찍 끊겼어요.','now','시간-①','비용-①'],['K2','회사에서 나왔는데 막차까지 10분 남았어요.','now','안전-①','비용-①'],['K3','내일 아침 일찍 출근해야 해요.','now','시간-①','비용-②'],['K4','택시를 타면 집까지 6만 원이 넘어요.','now','비용-①','안전-②'],['K5','같이 타면 다른 사람을 내려 주느라 15분 더 걸려요.','future','시간-①','비용-②'],['K6','혼자 타면 요금이 2배예요.','future','비용-①','안전-②']];
const ETYPES={T:['⏱ 시간','확정이 깨질 때'],R:['👥 관계','함께 탄 사람이 불편할 때'],S:['🪑 공간','내 자리가 침범될 때'],X:['🚪 탈출','벗어나고 싶은데 못 할 때'],A:['🌙 하차 후','내린 뒤 혼자 걸을 때']};
const EVENTS=[
 ['T1','T','③','부른 차가 10분 늦는대요.','시간-②','안전-①'],['T2','T','③','출발 직전 "함께 탈 사람이 늘어 경로가 바뀌었어요" 알림이 와요. 도착이 15분 늦어져요.','시간-③','비용-②'],['T3','T','④','다른 승객을 먼저 내려 주느라 내 도착이 계속 늦어지고 있어요.','시간-①','비용-②'],

 {id:'future',t:'③ 필수 미래 조건',min:'13~19분'},{id:'cons',t:'④ 제약 상황',min:'19~25분'},{id:'events',t:'⑤ 이벤트',min:'25~33分'.replace('分','분')},

/* ===================== STORE ===================== */
let db=null, sessions={}, cur=null, step=0, saveTimer=null, saving='', storeMode='local';
const LS='drt-cocreation-sessions';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}}
sessions=lsLoad();
(async()=>{
  await 0; // let the rest of the script define its helpers first
  try{ if(window.claude&&claude.use){ db=await claude.use('db'); } }catch(e){db=null}
  if(db){
    storeMode='shared';
    db.collection('sessions').onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});
      // keep the local unsaved copy of the open session
      if(cur&&next[cur.id]&&(next[cur.id].updatedAt||0)<(cur.updatedAt||0)) next[cur.id]=cur;
      sessions=next; if(view!=='play'||!cur) render(); else renderRailOnly();
    },err=>{storeMode='local';db=null;render()});
  }
  render();
})();
function newSession(code,role){
  const id=(code||'P')+'-'+Date.now().toString(36);
  return {id,code,role,createdAt:Date.now(),updatedAt:Date.now(),consent:false,facilitator:'',night:{},journey:{},star:'',starWhy:'',j6:{text:'',ei:''},future:{},cons:{},played:[],events:{},drawn:[],n3:{text:'',ei:''},opts:{},flip:'',flipWhy:'',b1:'',b2:'',changed:'',worry:'',relay:'',
    hidden:'',dpass:'',devents:{},dreplace:'',dhard:''};
}
function markDirty(){ if(!cur) return; cur.updatedAt=Date.now(); sessions[cur.id]=cur; lsSave(); saving='저장 대기 중'; setStatus(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,900); }
async function flush(){
  clearTimeout(saveTimer); if(!cur) return;
  if(!db){ saving='이 브라우저에 저장됨'; setStatus(); return; }
  saving='저장 중…'; setStatus();
  try{ await db.doc('sessions/'+cur.id).set(JSON.parse(JSON.stringify(cur))); saving='팀 공유 저장 완료'; }
  catch(e){ saving = e&&e.code==='invalid_argument' ? '저장 권한이 없어요. 이 페이지의 공유 설정에서 "참여자" 이상 권한이 필요해요.' : '저장하지 못했어요. 잠시 뒤 다시 저장돼요.'; }
  setStatus();
}
function setStatus(){ const el=document.getElementById('status'); if(el) el.textContent=saving; }

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function critCard(code,pressed,attr){const [k,tx,m]=CRIT[code];return `<button type="button" class="card pick k-${k}" aria-pressed="${pressed?'true':'false'}" ${attr}><span class="code">${code} · ${CATNAME[k]}</span><span class="tx">${esc(tx)}</span><span class="meta">${esc(m)}</span></button>`.replace(' · ',', ')}
function reactUI(path,val){return `<div class="react" role="group" aria-label="반응">${[['ok','🟢 탄다'],['mid','🟡 고민'],['no','🔴 안 탄다']].map(([v,l])=>`<button type="button" class="chip" data-v="${v}" data-set="${path}" data-val="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`}
function eiUI(path,val){return `<div class="seg" role="group" aria-label="근거 수준">${[['E','실제 경험 (E)'],['I','상상 (I)']].map(([v,l])=>`<button type="button" class="chip" data-set="${path}" data-val="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`}
function ta(path,val,ph,id){return `<textarea id="${id||('t-'+path.replace(/\W/g,'_'))}" data-text="${path}" placeholder="${esc(ph||'')}">${esc(val||'')}</textarea>`}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks.at(-1)]=v}
function ask(html){return `<div class="ask">${html}</div>`}

/* ===================== ROUTING ===================== */
let view='play';
function route(){const h=(location.hash||'#play').slice(1);view=['play','results','cards'].includes(h)?h:'play';document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===view?'page':'false'));render()}
window.addEventListener('hashchange',route);

function render(){
  const app=$('#app');
  if(view==='results') app.innerHTML=renderResults();
  else if(view==='cards') app.innerHTML=renderCards();
  else app.innerHTML=cur?renderPlay():renderLobby();
}
function renderRailOnly(){const r=document.getElementById('rail');if(r)r.outerHTML=railHTML();}

function steps(){return cur&&cur.role==='driver'?STEPS_DRIVER:STEPS_USER}
function railHTML(){return `<nav class="rail" id="rail" aria-label="단계">${steps().map((s,i)=>`<button type="button" data-step="${i}" ${i===step?'aria-current="step"':''} class="${i<step?'done':''}"><span class="n">${String(i).padStart(2,'0')}</span>${esc(s.t)}</button>`).join('')}</nav>`}
function renderPlay(){
  const S=steps(), s=S[step];
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"><span class="badge">${esc(cur.code)}</span><b>${esc(ROLES[cur.role])}</b></div><button class="btn small ghost" id="btn-exit" type="button">세션 목록으로</button></div>
  <div class="play">${railHTML()}
   <div class="stage"><div class="stephead"><div><h1>${esc(s.t)}</h1></div><span class="time">${s.min}</span></div>
    ${STEP_RENDER[s.id]()}
    <div class="foot"><button class="btn ghost" data-go="-1" type="button" ${step===0?'disabled':''}>이전</button><span class="status" id="status" aria-live="polite">${esc(saving)}</span>${step<S.length-1?`<button class="btn primary" data-go="1" type="button">다음: ${esc(S[step+1].t)}</button>`:`<button class="btn primary" id="btn-finish" type="button">세션 끝내고 저장</button>`}</div>
   </div></div>`;
}

/* ===================== RESULTS ===================== */
function critTally(list){
  const t={};Object.keys(CRIT).forEach(k=>t[k]={kept:0,dropped:0});
  list.forEach(s=>{
    const go=(kind,arr)=>Object.entries(s[kind]||{}).forEach(([c,d])=>{const card=arr(c);if(!card||!d.pick)return;const [a,b]=card;if(d.pick==='none')return;const other=d.pick===a?b:a;t[d.pick]&&t[d.pick].kept++;t[other]&&t[other].dropped++;});
    go('cons',c=>{const x=CONS.find(y=>y[0]===c);return x?[x[3],x[4]]:null});
    go('events',c=>{const x=EV[c];return x?[x[4],x[5]]:null});
  });return t;}
function renderResults(){
  const all=Object.values(sessions), us=all.filter(s=>s.role!=='driver'), dr=all.filter(s=>s.role==='driver');
  if(!all.length) return `<h1>팀 결과</h1><p class="lede">세션이 쌓이면 여기에서 개입 지점, 범위, Trade-off 규칙, 서비스 원칙이 자동으로 정리돼요.</p><div class="empty">아직 진행한 세션이 없어요. "세션 진행"에서 첫 세션을 시작하거나, 팀원의 결과 파일을 합쳐 보세요.</div>${dataTools()}`;
  const star={};JOURNEY.forEach(([c])=>star[c]=0);us.forEach(s=>{if(s.star)star[s.star]++});
  const fut={};FUTURE.concat([N3]).forEach(([c])=>fut[c]={ok:0,mid:0,no:0,scenes:{}});
  us.forEach(s=>{Object.entries(s.future||{}).forEach(([c,f])=>{if(!fut[c])return;if(f.react)fut[c][f.react]++;(f.scenes||[]).forEach(j=>fut[c].scenes[j]=(fut[c].scenes[j]||0)+1)});if(s.n3?.react)fut.N3[s.n3.react]++;});

  const ev={};Object.keys(ETYPES).forEach(k=>ev[k]={ok:0,mid:0,no:0,n:0});us.forEach(s=>Object.entries(s.events||{}).forEach(([c,d])=>{const e=EV[c];if(!e)return;ev[e[1]].n++;if(d.react)ev[e[1]][d.react]++;}));
  const op={};OPTIONS.forEach(([c])=>op[c]={must:0,nice:0,no:0,flip:0});us.forEach(s=>{Object.entries(s.opts||{}).forEach(([c,v])=>{if(op[c]&&op[c][v]!=null)op[c][v]++});if(op[s.flip])op[s.flip].flip++;});

}

function dataTools(){return `<section class="panel datapanel" aria-labelledby="dt-h"><h2 id="dt-h">결과 파일 (팀원끼리 합치기)</h2>
  <p class="muted" style="margin:0">이 사이트는 서버 없이 <b>이 브라우저에만</b> 저장해요. 세션을 마치면 <b>결과 파일 저장</b>으로 내려받아 팀 폴더에 올려 주세요. 결과를 모아 볼 사람은 팀원들의 파일을 <b>결과 합치기</b>로 한꺼번에 불러오면 돼요. 같은 세션은 가장 최근 것만 남아요.</p>
  <div class="row"><button class="btn primary" id="btn-export" type="button">결과 파일 저장 (${Object.keys(sessions).length}개 세션)</button>
  <label class="btn" for="in-import" style="display:inline-block">결과 합치기<input type="file" id="in-import" accept="application/json,.json" multiple hidden></label>
  <button class="btn ghost" id="btn-clear" type="button">이 브라우저 기록 지우기</button></div>
  <div id="clear-confirm" hidden class="note">정말 지울까요? 저장하지 않은 세션은 되돌릴 수 없어요. <button class="btn small" id="btn-clear-yes" type="button">지우기</button> <button class="btn small ghost" id="btn-clear-no" type="button">취소</button></div>
  <span class="status" id="dt-status" aria-live="polite"></span></section>`}
function exportJSON(){const data={app:'drt-cocreation',version:1,exportedAt:new Date().toISOString(),sessions};const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');const d=new Date();a.href=URL.createObjectURL(blob);a.download=`cocreation-${d.getMonth()+1}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
async function importFiles(files){let n=0,bad=0;for(const f of files){try{const j=JSON.parse(await f.text());const ss=j.sessions||j;for(const [id,s] of Object.entries(ss)){if(!s||typeof s!=='object'||!s.id)continue;if(!sessions[id]||(s.updatedAt||0)>(sessions[id].updatedAt||0)){sessions[id]=s;n++;}}}catch(e){bad++}}lsSave();render();const st=document.getElementById('dt-status');if(st)st.textContent=`${n}개 세션을 합쳤어요.`+(bad?` 읽지 못한 파일 ${bad}개는 건너뛰었어요.`:'');}
/* ===================== CARDS ===================== */
function renderCards(){
  const deck=(t,sub,html)=>`<section style="margin-top:22px"><div class="deckhead"><h2>${t}</h2><span class="muted">${sub}</span></div><div class="grid g3" style="margin-top:8px">${html}</div></section>`;
  return `<h1>카드 전체</h1><p class="lede">세션에 쓰는 카드 전부예요. 부루마블로 치면 여정은 게임판, 미래 조건은 규칙이 바뀌는 카드, 이벤트는 황금열쇠, 제약은 무인도와 통행료, 기준 카드는 내 가방 속 짐이에요.</p>
  ${deck('전제','시작할 때 서비스의 큰 그림만',`<div class="card k-future"><span class="code">P0</span><span class="tx">${esc(PREMISE)}</span></div>`)}
  ${deck('나의 밤 (10)','참여자의 실제 그날 밤을 고정',Object.values(NIGHT).flat().map(([c,t])=>`<div class="card k-night"><span class="code">${c}</span><span class="tx">${t}</span></div>`).join(''))}
  ${deck('여정 (6)','우리 여정맵 그대로',JOURNEY.map(([c,t,d])=>`<div class="card k-journey"><span class="code">${c}</span><span class="tx">${t}</span><span class="meta">${d}</span></div>`).join(''))}
  ${deck('필수 미래 조건 (4)','서비스의 본질. 모두에게 보여 줌',FUTURE.concat([N3]).map(([c,n,t,w])=>`<div class="card k-future"><span class="code">${c}, ${esc(w)}</span><span class="tx">${n}</span><span>${esc(t)}</span></div>`).join(''))}
  ${deck('부수 미래 조건 (6)','옵션. 꼭 있어야 / 있으면 좋다 / 없어도 된다',OPTIONS.map(([c,n,t])=>`<div class="card k-opt"><span class="code">${c}</span><span class="tx">${n}</span><span>${esc(t)}</span></div>`).join(''))}
  ${deck('기준 카드 (11)','상황마다 2장만 내민다',Object.keys(CRIT).map(c=>`<div class="card k-${CRIT[c][0]}"><span class="code">${c}</span><span class="tx">${esc(CRIT[c][1])}</span><span class="meta">${esc(CRIT[c][2])}</span></div>`).join(''))}
  ${deck('제약 카드 (6)','지금 4장 + 미래 2장',CONS.map(([c,t,w,a,b])=>`<div class="card k-cons"><span class="code">${c}, ${w==='now'?'지금':'미래'}</span><span class="tx">${esc(t)}</span><span class="meta">내미는 2장: ${a} vs ${b}</span></div>`).join(''))}
  ${deck('이벤트 카드 (15)','종류별 1장씩, R4는 필수',EVENTS.map(e=>`<div class="card k-event"><span class="code">${e[0]}, ${ETYPES[e[1]][0]}, 장면 ${e[2]}</span><span class="tx">${esc(e[3])}</span><span class="meta">내미는 2장: ${e[4]} vs ${e[5]}</span></div>`).join(''))}`;
}

/* ===================== EVENTS ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-open]');if(!t)return;
  if(t.id==='btn-new'){const code=($('#in-code').value||'').trim().toUpperCase();if(!code){$('#in-code').focus();$('#in-code').placeholder='참여자 번호를 먼저 넣어 주세요';return;}const role=(document.querySelector('#role-pick [aria-pressed="true"]')||{}).dataset?.role||'core';cur=newSession(code,role);cur.facilitator=$('#in-fac').value.trim();step=0;sessions[cur.id]=cur;markDirty();flush();render();scrollTo(0,0);return;}
  if(t.dataset.role){document.querySelectorAll('#role-pick .chip').forEach(c=>c.setAttribute('aria-pressed',c===t));return;}
  if(t.dataset.open){cur=JSON.parse(JSON.stringify(sessions[t.dataset.open]));step=0;render();scrollTo(0,0);return;}
  if(t.id==='btn-exit'){flush();cur=null;render();return;}
  if(t.id==='btn-finish'){flush();cur=null;location.hash='#results';render();return;}
  if(t.dataset.go){flush();step=Math.max(0,Math.min(steps().length-1,step+Number(t.dataset.go)));render();scrollTo(0,0);return;}
  if(t.dataset.step!=null&&t.closest('#rail')){flush();step=Number(t.dataset.step);render();scrollTo(0,0);return;}
  if(t.id==='btn-draw'){const pick=Object.keys(ETYPES).map(k=>{const pool=EVENTS.filter(x=>x[1]===k);return pool[Math.floor(Math.random()*pool.length)][0]});if(!pick.includes('R4')){pick[1]='R4';}cur.drawn=pick;markDirty();render();return;}
  if(t.dataset.set&&cur){const p=t.dataset.set,v=t.dataset.val;setP(cur,p,getP(cur,p)===v?'':v);markDirty();render();return;}
  if(t.dataset.toggle&&cur){const p=t.dataset.toggle,v=t.dataset.val;let a=getP(cur,p);if(!Array.isArray(a))a=[];a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);setP(cur,p,a);markDirty();render();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.text&&cur){setP(cur,t.dataset.text,t.value);markDirty();}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.id==='btn-export'){if(cur)flush();exportJSON();const st=document.getElementById('dt-status');if(st)st.textContent='결과 파일을 내려받았어요. 팀 폴더에 올려 주세요.';}
  if(t.id==='btn-clear'){document.getElementById('clear-confirm').hidden=false;}
  if(t.id==='btn-clear-no'){document.getElementById('clear-confirm').hidden=true;}
  if(t.id==='btn-clear-yes'){sessions={};cur=null;lsSave();render();}
});
document.addEventListener('change',e=>{if(e.target.id==='in-import'&&e.target.files.length){importFiles([...e.target.files]);return;}if(e.target.id==='chk-consent'&&cur){cur.consent=e.target.checked;markDirty();}});
route();
</script>
